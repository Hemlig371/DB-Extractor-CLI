[package]
name = "db-extractor"
version = "0.1.0"
edition = "2021"
description = "Fast database exporter (Rust build): connectorx -> Arrow -> Parquet/CSV/Arrow IPC/JSONL"
license = "MIT"

[[bin]]
name = "db-extractor"
path = "src/main.rs"

[dependencies]
dbx-core = { path = "../dbx-core" }

# Все источники connectorx включены при сборке; нужный выбирается по схеме URI во время работы.
# Копия connectorx 0.4.6 в vendor/connectorx (изменения перечислены в vendor/connectorx/VENDORED.md).
connectorx = { path = "../vendor/connectorx", features = [
  "dst_arrow",
  "src_postgres",
  "src_mysql",
  "src_sqlite",
  "src_mssql",
  "src_oracle",
  "src_bigquery",
  "src_trino",
  "src_clickhouse",
] }

# Версия arrow должна совпадать с той, что использует connectorx (56.x), иначе типы RecordBatch не совместимы.
arrow = { version = "56.2", features = ["ipc_compression", "chrono-tz"] }
parquet = { version = "56.2", features = ["arrow", "snap", "brotli", "flate2", "lz4", "zstd"] }

clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
hmac = "0.12"
flate2 = "1"
zstd = "0.13"
encoding_rs = "0.8"

[dev-dependencies]
tempfile = "3"
