name: Build Binaries

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Имя тега для релиза (например, v1.0.0)'
        required: false
        default: ''
        type: string

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --prefer-binary -r requirements-dev.txt

    - name: Record exact dependency versions
      shell: bash
      run: |
        mkdir -p dist
        pip freeze > "dist/requirements-lock-${{ runner.os }}.txt"
        cat "dist/requirements-lock-${{ runner.os }}.txt"

    - name: Run tests
      run: python -m unittest discover -s tests -v

    - name: Build with PyInstaller
      run: |
        pyinstaller --name db-extractor-${{ runner.os }} --onedir --collect-all connectorx --collect-all polars --collect-all pyarrow --collect-all tzdata src-python/main.py

    - name: Smoke test the built binary
      shell: bash
      run: |
        EXE="dist/db-extractor-${{ runner.os }}/db-extractor-${{ runner.os }}"
        if [ "$RUNNER_OS" = "Windows" ]; then EXE="$EXE.exe"; fi
        "$EXE" --help
        python -c "import sqlite3; c = sqlite3.connect('smoke.db'); c.execute('create table t(id integer, name text)'); c.execute(\"insert into t values (1, 'a')\"); c.commit()"
        CONN=$(python -c "import os, urllib.parse; print('sqlite://' + urllib.parse.quote(os.path.abspath('smoke.db')))")
        "$EXE" --conn "$CONN" --query "select id, name from t" --out smoke.parquet
        test -s smoke.parquet

    - name: Zip the application
      shell: python
      run: |
        import shutil
        shutil.make_archive('dist/db-extractor-${{ runner.os }}', 'zip', 'dist/db-extractor-${{ runner.os }}')

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: db-extractor-${{ runner.os }}
        path: |
          dist/db-extractor-${{ runner.os }}.zip
          dist/requirements-lock-${{ runner.os }}.txt
        if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    permissions:
      contents: write
    # Python- и Rust-сборки дописывают файлы в один черновик релиза; параллельный запуск создал бы два черновика.
    concurrency:
      group: release-${{ inputs.tag_name || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
